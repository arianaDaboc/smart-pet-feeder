<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Guardian AI Smart Pet Feeder video demonstration</title>
  <desc id="description">Click to watch the complete Guardian AI product demonstration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#123b54"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect width="1200" height="630" rx="28" fill="url(#glow)"/>
  <g fill="none" stroke="#5eead4" stroke-opacity=".14">
    <circle cx="1050" cy="80" r="180"/>
    <circle cx="1050" cy="80" r="245"/>
    <circle cx="120" cy="590" r="190"/>
  </g>
  <text x="600" y="105" fill="#99f6e4" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="4">GUARDIAN AI</text>
  <text x="600" y="165" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle">Smart Pet Feeder</text>
  <g filter="url(#shadow)">
    <circle cx="600" cy="330" r="92" fill="#ffffff" fill-opacity=".96"/>
    <path d="M575 278 L575 382 L660 330 Z" fill="#0f766e"/>
  </g>
  <text x="600" y="478" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Watch the complete demonstration</text>
  <rect x="532" y="512" width="136" height="48" rx="24" fill="#0f172a" fill-opacity=".65" stroke="#5eead4" stroke-opacity=".65"/>
  <text x="600" y="545" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">7:44</text>
</svg>
